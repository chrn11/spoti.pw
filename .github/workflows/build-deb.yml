name: Build deb

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build-deb:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: brew install make dpkg ldid

      - name: Restore Spotify flag table
        env:
          SG_FLAG_LIST: ${{ secrets.SG_FLAG_LIST }}
        run: |
          if [ -n "$SG_FLAG_LIST" ]; then
            echo "$SG_FLAG_LIST" | base64 -d | gunzip > tweak/Sources/Shared/Flags/SGFlagList.m
          else
            echo "::warning::SG_FLAG_LIST is not configured; building with an empty flag table"
            cat > tweak/Sources/Shared/Flags/SGFlagList.m <<'EOF'
          // No Spotify IPA was supplied for this deb-only build.
          #import "Flags.h"
          const SGFlagDef SGFlagTable[1] = {{0}};
          const NSUInteger SGFlagCount = 0;
          EOF
          fi

      - name: Build deb
        run: env -u MAKELEVEL gmake -C tweak clean package

      - name: Upload deb
        uses: actions/upload-artifact@v5
        with:
          name: spoti.pw-deb
          path: tweak/packages/*.deb
          if-no-files-found: error
          retention-days: 7
